{% load static %}
<div class="jumbotron p-5 rounded bg-light shadow-sm">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-7">
                <h1 class="display-5 text-center text-md-start">Welcome to StirCraft</h1>
                <p class="lead text-muted text-center text-md-start">Discover, create, and share cocktail recipes crafted by a passionate community.</p>
                <p class="text-center text-md-start">
                    {% if user.is_authenticated %}
                        <a href="{% url 'cocktail_create' %}" class="btn btn-primary btn-lg" aria-label="Create a Cocktail" tabindex="0">Create a Cocktail</a>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-lg ms-2" aria-label="Your Dashboard" tabindex="0">Your Dashboard</a>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-primary btn-lg" aria-label="Log in" tabindex="0">Log in</a>
                        <a href="{% url 'cocktail_index' %}" class="btn btn-outline-secondary btn-lg ms-2" aria-label="Browse Cocktails" tabindex="0">Browse Cocktails</a>
                    {% endif %}
                </p>
                <!-- Mobile logo below Welcome -->
                <div class="d-block d-md-none text-center mt-3">
                    <img src="{% static 'images/favicon_io/stircraftLogoNew.png' %}" alt="StirCraft logo" class="img-fluid rounded shadow-sm home-hero-logo" style="max-width:160px;">
                </div>
            </div>

            <div class="col-md-5 text-center d-none d-md-block">
                <img src="{% static 'images/favicon_io/stircraftLogoNew.png' %}" alt="StirCraft logo" class="img-fluid rounded shadow-sm home-hero-logo">
            </div>
        </div>
    </div>
</div>
